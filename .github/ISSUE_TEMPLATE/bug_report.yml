name: Bug Report
description: Something is broken or crashing
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill this out as completely as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run offline_translator with ...
        2. Launch runtime_layer with ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell

  - type: dropdown
    id: component
    attributes:
      label: Which component?
      options:
        - elf-parser
        - shader-compiler
        - syscall-stubs
        - memory-manager
        - vulkan-backend
        - dynamic-jit
        - other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS & GPU
      placeholder: "Windows 11, NVIDIA RTX 3070"
    validations:
      required: true

  - type: input
    id: test-binary
    attributes:
      label: Test binary used
      description: Which homebrew / test ELF triggered the bug? (Never share commercial game files)
      placeholder: "ps5-playground/example-hello"

